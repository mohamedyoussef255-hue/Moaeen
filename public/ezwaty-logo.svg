<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- 3D Blue Gradients -->
    <linearGradient id="eBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="eBlueFold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <!-- Dynamic Orange Orbit Gradient -->
    <linearGradient id="eOrangeOrbit" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean subtle rounded container for contrast -->
  <rect x="15" y="15" width="570" height="570" rx="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Back arc of orange ring -->
  <path d="M 140 230 C 110 160, 360 85, 460 145" fill="none" stroke="url(#eOrangeOrbit)" stroke-width="18" stroke-linecap="round"/>

  <!-- 3D Stylized Modern Letter "E" -->
  <!-- Top Bar -->
  <path d="M 270 70 C 370 70, 440 115, 440 185 C 440 225, 415 248, 365 260 C 420 272, 450 310, 450 355 C 450 425, 370 465, 270 465 C 205 465, 160 435, 155 398 C 152 380, 164 368, 182 368 C 196 368, 206 378, 214 388 C 226 404, 244 416, 274 416 C 338 416, 382 386, 382 344 C 382 302, 340 276, 268 276 L 238 276 C 226 276, 220 266, 220 254 C 220 242, 226 232, 238 232 L 268 232 C 334 232, 370 206, 370 170 C 370 134, 334 116, 274 116 C 238 116, 214 132, 198 156 C 190 168, 178 172, 166 172 C 150 172, 138 158, 144 140 C 156 98, 204 70, 270 70 Z" fill="url(#eBlueGrad)"/>

  <!-- Front wrapping swoop of orange ring -->
  <path d="M 125 255 C 130 300, 200 338, 330 320 C 415 308, 485 265, 498 215 C 502 196, 492 184, 474 188 C 456 193, 402 240, 318 262 C 222 286, 149 271, 125 255 Z" fill="url(#eOrangeOrbit)"/>

  <!-- 3D Digital Pixel Blocks (Top Right) -->
  <rect x="440" y="80" width="22" height="22" rx="4" fill="#0284c7"/>
  <rect x="470" y="80" width="22" height="22" rx="4" fill="#0284c7"/>
  <rect x="440" y="110" width="22" height="22" rx="4" fill="#f97316"/>
  <rect x="470" y="110" width="22" height="22" rx="4" fill="#ea580c"/>
  <rect x="500" y="110" width="22" height="22" rx="4" fill="#0284c7"/>
  <rect x="470" y="140" width="22" height="22" rx="4" fill="#f97316"/>

  <!-- Typography: "عزوتي" in rich navy blue -->
  <text x="300" y="520" text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif" font-size="70" font-weight="900" fill="#0f2b5c" letter-spacing="-1">عزوتي</text>

  <!-- Accent Lines & "للبرمجيات وتكنولوجيا المعلومات" -->
  <line x1="85" y1="544" x2="140" y2="544" stroke="#f97316" stroke-width="4.5" stroke-linecap="round"/>
  <text x="300" y="550" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="20" font-weight="700" fill="#0f2b5c" letter-spacing="0.5">للبرمجيات وتكنولوجيا المعلومات</text>
  <line x1="460" y1="544" x2="515" y2="544" stroke="#f97316" stroke-width="4.5" stroke-linecap="round"/>

  <!-- "EZWATY IT" in English -->
  <text x="245" y="582" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#0f2b5c" letter-spacing="4">EZWATY</text>
  <text x="380" y="582" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="900" fill="#ea580c" letter-spacing="4">IT</text>
</svg>
